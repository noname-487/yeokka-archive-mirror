name: Refresh archive cache and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Cache refresh scope
        type: choice
        options: [all, recent]
        default: all
permissions: {}
concurrency:
  group: archive-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refresh shared cache
        env:
          CACHE_SCOPE: ${{ github.event.inputs.scope || (github.event.schedule == '23 18 * * *' && 'all' || 'recent') }}
        run: node scripts/sync-cache.mjs --"$CACHE_SCOPE"
      - name: Build static site
        run: node scripts/build-pages.mjs
      - name: Verify archive and browser storage
        run: |
          node scripts/test-cache.mjs
          node scripts/test-library.mjs
          node scripts/test-security.mjs
      - name: Keep latest successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data docs/index.html worker/cache-seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public archive cache'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
  deploy:
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
