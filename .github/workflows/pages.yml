name: Refresh archive cache and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Cache refresh scope
        type: choice
        options: [all, recent]
        default: all
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: archive-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh shared cache
        env:
          CACHE_SCOPE: ${{ github.event.inputs.scope || (github.event.schedule == '23 18 * * *' && 'all' || 'recent') }}
        run: node scripts/sync-cache.mjs --"$CACHE_SCOPE"
      - name: Build static site
        run: node scripts/build-pages.mjs
      - name: Verify archive and browser storage
        run: |
          node scripts/test-cache.mjs
          node scripts/test-library.mjs
      - name: Keep latest successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data docs/index.html worker/cache-seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public archive cache'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
