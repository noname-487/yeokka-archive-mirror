name: Refresh archive cache and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # Check every ten minutes; fetch only when the cache is due.
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Cache refresh scope
        type: choice
        options: [all, recent]
        default: all
permissions: {}
concurrency:
  group: archive-pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      publish: ${{ steps.freshness.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Decide cache refresh scope
        id: freshness
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const now = Date.now();
          const config = JSON.parse(fs.readFileSync('config/sources.json', 'utf8'));
          let manifest;
          try { manifest = JSON.parse(fs.readFileSync('docs/data/manifest.json', 'utf8')); } catch {}
          const keys = Object.entries(config).flatMap(([year, value]) => Object.keys(value.months).map(month => [Number(year), Number(month)])).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
          const age = ([year,month]) => {
            const entry = manifest?.months?.find(m => m.year === year && m.month === month);
            const time = Date.parse(entry?.updatedAt);
            return Number.isFinite(time) && time <= now ? now-time : Infinity;
          };
          const dailyDue = keys.some(key => age(key) >= 24*60*60*1000);
          const recentDue = keys.slice(-2).some(key => age(key) >= 30*60*1000);
          const event = process.env.GITHUB_EVENT_NAME;
          const forcedDaily = process.env.SCHEDULE === '23 18 * * *';
          const scope = event === 'workflow_dispatch' ? process.env.REQUESTED_SCOPE || 'all' : (forcedDaily || dailyDue ? 'all' : 'recent');
          const run = event !== 'schedule' || forcedDaily || dailyDue || recentDue;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run='+run+'\nscope='+scope+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Cache check: '+new Date(now).toISOString()+'\n\n'+(run ? 'Refresh scope: '+scope : 'Cache is fresh; no source requests or deployment needed.')+'\n');
          NODE
      - name: Refresh shared cache
        if: steps.freshness.outputs.run == 'true'
        env:
          CACHE_SCOPE: ${{ steps.freshness.outputs.scope }}
        run: node scripts/sync-cache.mjs --"$CACHE_SCOPE"
      - name: Build static site
        if: steps.freshness.outputs.run == 'true'
        run: node scripts/build-pages.mjs
      - name: Verify archive and browser storage
        if: steps.freshness.outputs.run == 'true'
        run: |
          node scripts/test-cache.mjs
          node scripts/test-library.mjs
          node scripts/test-security.mjs
      - name: Keep latest successful snapshots
        if: steps.freshness.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data docs/index.html worker/cache-seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public archive cache'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.freshness.outputs.run == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
  deploy:
    if: needs.build.outputs.publish == 'true'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
