/* Date navigation: 40px controls; arrows and focus stay within their own bounds. */
.month-step{gap:8px;align-items:center}
.month-step>.icon{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;min-height:40px;padding:0;line-height:1}

.month-step>#current{height:40px;min-height:40px;line-height:20px}
.month-selects{gap:12px;align-items:center}
.select-control{position:relative;display:inline-grid;min-width:0;isolation:isolate}
.select-control:after{content:'';position:absolute;right:15px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select-control>select{appearance:none;-webkit-appearance:none;display:block;width:100%;height:40px;min-height:40px;padding:8px 36px 8px 12px;line-height:20px;cursor:pointer;min-width:88px;margin:0}
.select-control:has(#yearSelect)>select{min-width:104px}
.select-control>select:focus{outline:2px solid var(--green);outline-offset:-2px;border-color:var(--green);box-shadow:none}

$('#noteText').oninput=()=>{$('#noteCount').textContent=$('#noteText').value.length+' / 1,000'};$('#noteCancel').onclick=()=>{if($('#noteText').value===(notes[noteDate]||'')||confirm('저장하지 않은 메모를 닫을까요?'))$('#noteDialog').close()};$('#noteSave').onclick=saveNote;$('#noteClear').onclick=()=>{if(!confirm('이 날짜의 메모를 삭제할까요?'))return;$('#noteText').value='';saveNote()};
window.addEventListener('storage',e=>{if(e.key==='yeokka-mirror-notes-v1'){try{const stored=JSON.parse(e.newValue||'{}');notes={};if(stored&&typeof stored==='object')for(const [key,v]of Object.entries(stored))if(/^202[456]-\d{2}-\d{2}$/.test(key)&&typeof v==='string')notes[key]=v.slice(0,1000);render()}catch{}}if(e.key==='yeokka-mirror-theme'&&['dark','light'].includes(e.newValue))setTheme(e.newValue)});
function cleanVideo(v){return checkedVideo(v)}
function rememberVideo(e){if(e.videoId){try{videoRegistry.set(e.videoId,cleanVideo(e))}catch{return ''}}return e.videoId||''}
function favorite(e){return personal.favorites.some(v=>v.videoId===e.videoId)}
function libraryError(message){$('#personalNotice').hidden=!message;$('#personalNotice').textContent=message||'';$('#libraryStatus').textContent=message||''}
function readLocal(){const raw=localStorage.getItem(libraryKey);if(!raw)return{version:1,favorites:[],history:[],lists:[]};try{return checkedLibrary(JSON.parse(raw))}catch{throw Error('저장된 보관함을 읽을 수 없습니다. 브라우저 데이터를 확인해 주세요.')}}
function commitLocal(patch){const previous={};for(const key of Object.keys(patch))previous[key]=localStorage.getItem(key);try{for(const [key,value]of Object.entries(patch))localStorage.setItem(key,value)}catch{for(const [key,value]of Object.entries(previous))try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch{}throw Error('브라우저에 저장하지 못했습니다. 저장 공간이나 브라우저 설정을 확인해 주세요.')}}
function writeLocal(value){const data=checkedLibrary(value);commitLocal({[libraryKey]:JSON.stringify(data)});return data}
async function loadPersonal(){try{const data=readLocal();personal={...data,authenticated:true,lists:data.lists.map(l=>({...l,count:l.videos.length}))};personalError='';updateStars();if($('#libraryDialog').open)renderLibrary()}catch(e){personalError=e.message;libraryError(e.message);if($('#libraryDialog').open)renderLibrary()}}
async function personalRequest(body){const state=readLocal(),now=new Date().toISOString();let result={success:true,at:now};
 if(body.action==='favorite'){const v=checkedVideo(body.video);state.favorites=state.favorites.filter(x=>x.videoId!==v.videoId);if(body.enabled)state.favorites.unshift({...v,favoriteAt:now});if(state.favorites.length>1000)throw Error('즐겨찾기는 최대 1,000개까지 저장할 수 있습니다.')}
 else if(body.action==='click'){const v=checkedVideo(body.video);state.history=[{...v,clickedAt:now},...state.history.filter(x=>x.videoId!==v.videoId)].slice(0,200)}
 else if(body.action==='clear_history')state.history=[];
 else if(body.action==='remove_history')state.history=state.history.filter(x=>x.videoId!==body.videoId);
 else if(body.action==='create_list'){if(state.lists.length>=50)throw Error('목록은 최대 50개까지 만들 수 있습니다.');state.lists.unshift({id:body.listId,name:checkedName(body.name),createdAt:now,videos:[]});result.id=body.listId}
 else{const list=state.lists.find(l=>l.id===body.listId);if(!list)throw Error('목록을 찾을 수 없습니다.');if(body.action==='rename_list')list.name=checkedName(body.name);else if(body.action==='delete_list')state.lists=state.lists.filter(l=>l.id!==body.listId);else if(body.action==='add_to_list'){const v=checkedVideo(body.video);list.videos=[...list.videos.filter(x=>x.videoId!==v.videoId),v];if(list.videos.length>1000)throw Error('한 목록에는 최대 1,000개 영상을 담을 수 있습니다.')}else if(body.action==='remove_from_list')list.videos=list.videos.filter(x=>x.videoId!==body.videoId);else throw Error('지원하지 않는 보관함 동작입니다.')}
 writeLocal(state);return result;
}
function updateStars(){$$('[data-fav]').forEach(b=>{const v=videoRegistry.get(b.dataset.fav),saved=v&&favorite(v);b.classList.toggle('is-saved',!!saved);b.setAttribute('aria-pressed',!!saved);b.textContent=saved?'★ 즐겨찾기':'☆ 즐겨찾기'})}
async function toggleFavorite(id){if(busyVideos.has(id))return;const v=videoRegistry.get(id);if(!v)return;busyVideos.add(id);try{await personalRequest({action:'favorite',video:v,enabled:!favorite(v)});await loadPersonal();libraryError('')}catch(e){libraryError(e.message)}finally{busyVideos.delete(id)}}
async function recordClick(id){const v=videoRegistry.get(id);if(!v)return;try{await personalRequest({action:'click',video:v});await loadPersonal()}catch(e){libraryError('최근 클릭 기록을 저장하지 못했습니다. '+e.message)}}
function timeLabel(date){return date?new Date(date).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function renderLibrary(){
 $$('[data-library-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.libraryTab===libraryTab);b.setAttribute('aria-pressed',b.dataset.libraryTab===libraryTab)});$('#librarySearch').value=libraryQuery;$('#listCreateControls').hidden=libraryTab!=='lists';$('#libraryStatus').textContent=personalError;
 if(personalError){$('#libraryContent').innerHTML='<p class="library-empty">'+esc(personalError)+'</p>';return}
 const q=libraryQuery.trim().toLocaleLowerCase();let videos=[];
 $('#librarySearch').placeholder=libraryTab==='notes'?'날짜·메모 검색':'제목 검색';
 if(libraryTab==='notes'){const saved=Object.entries(notes).filter(([date,text])=>(date+' '+text).toLocaleLowerCase().includes(q)).sort((a,b)=>b[0].localeCompare(a[0]));$('#libraryContent').innerHTML='<div class="notes-list">'+saved.map(([date,text])=>'<button class="saved-note" data-library-note="'+date+'"><strong>'+esc(dateLabel(date))+'</strong><span>'+esc(text)+'</span></button>').join('')+'</div>'+(!saved.length?'<p class="library-empty">'+(q?'검색 결과가 없습니다.':'달력의 날짜를 열어 메모를 남겨 보세요.')+'</p>':'');return}

 if(libraryTab==='favorites')videos=personal.favorites;
 else if(libraryTab==='history')videos=personal.history;
 else if(selectedList){
  const l=personal.lists.find(x=>x.id===selectedList);if(!l){selectedList=null;renderLibrary();return}
  const items=listVideos.filter(e=>e.title.toLocaleLowerCase().includes(q));$('#libraryContent').innerHTML='<div class="list-detail-bar"><button class="plain" data-list-back>‹ 내 목록</button><h3>'+esc(l.name)+'</h3><span class="sub">'+listVideos.length+'개</span><button class="plain" data-list-rename="'+l.id+'">이름 변경</button><button class="plain" data-list-share="'+l.id+'">공유 코드</button><button class="plain danger" data-list-delete="'+l.id+'">목록 삭제</button></div><div class="cards library-cards">'+items.map(v=>'<div>'+card(v)+'<button class="item-remove" data-item-remove="'+esc(v.videoId)+'">목록에서 빼기</button></div>').join('')+'</div>'+(!items.length?'<p class="library-empty">'+(q?'검색 결과가 없습니다.':'영상 카드의 ‘＋ 목록’으로 영상을 담아 보세요.')+'</p>':'');return;
 }else{
  const lists=personal.lists.filter(l=>l.name.toLocaleLowerCase().includes(q));$('#libraryContent').innerHTML='<div class="list-grid">'+lists.map(l=>'<button class="bookmark-list" data-list-open="'+l.id+'"><span class="list-icon">▤</span><strong>'+esc(l.name)+'</strong><span>'+l.count+'개의 영상'+'</span></button>').join('')+'</div>'+(!lists.length?'<p class="library-empty">아직 목록이 없습니다. 새 목록을 만들거나 공유받은 코드를 가져오세요.</p>':'');return
 }
 videos=videos.filter(v=>v.title.toLocaleLowerCase().includes(q));$('#libraryContent').innerHTML=(libraryTab==='history'?'<div class="list-detail-bar"><p class="sub">링크를 연 최근 200개 영상</p><button class="plain danger" data-history-clear>최근 기록 비우기</button></div>':'<p class="viewnote">즐겨찾기 '+personal.favorites.length+'개</p>')+'<div class="cards library-cards">'+videos.map(v=>'<div>'+card(v)+(libraryTab==='history'?'<div class="history-meta"><span>'+esc(timeLabel(v.clickedAt))+' 클릭</span><button class="item-remove" data-history-remove="'+v.videoId+'">기록 삭제</button></div>':'')+'</div>').join('')+'</div>'+(!videos.length?'<p class="library-empty">'+(q?'검색 결과가 없습니다.':libraryTab==='history'?'아직 클릭한 영상이 없습니다.':'영상 카드의 별 버튼으로 즐겨찾기를 추가해 보세요.')+'</p>':'');
}

async function openList(id){const list=personal.lists.find(l=>l.id===id);if(!list)throw Error('목록을 찾을 수 없습니다.');selectedList=id;listVideos=list.videos;libraryTab='lists';$('#libraryStatus').textContent='';renderLibrary()}
async function chooseList(id){choosingVideo=videoRegistry.get(id);if(!choosingVideo)return;await loadPersonal();$('#chooseVideoTitle').textContent=choosingVideo.title;$('#chooseListSelect').innerHTML=personal.lists.map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join('');$('#chooseListSelect').hidden=!personal.lists.length;$('#chooseNewName').value='';$('#chooseError').textContent='';$('#chooseDialog').showModal()}
let transferPreview=null,transferMode='import';
function openCodeImport(){$('#codeTitle').textContent='공유·백업 코드 가져오기';$('#transferCode').value='';$('#transferCode').readOnly=false;$('#transferCode').placeholder='YKM1. 또는 YKB1.로 시작하는 코드 전체를 넣어 주세요.';$('#codeMessage').textContent='먼저 내용을 확인한 후 기존 정보에 합쳐 가져옵니다.';$('#codePreview').hidden=false;$('#codeCopy').hidden=true;$('#codeApply').hidden=true;$('#applyThemeWrap').hidden=true;$('#codeDescription').textContent='목록 공유 코드는 해당 목록만, 내 정보 백업 코드는 즐겨찾기·최근 클릭·목록·날짜 메모를 담습니다.';transferPreview=null;transferMode='import';$('#codeDialog').showModal()}
async function openCodeExport(listId=null){const list=listId?personal.lists.find(l=>l.id===listId):null;const doc=list?{type:'yeokka-list',version:1,name:list.name,videos:list.videos.map(cleanVideo)}:{type:'yeokka-backup',version:1,data:readLocal(),notes:checkedNotes(JSON.parse(localStorage.getItem(notesKey)||'{}')),theme:document.documentElement.dataset.theme};$('#codeTitle').textContent=list?'목록 공유 코드':'내 정보 백업 코드';$('#codeDescription').textContent=list?'이 코드에는 선택한 목록의 이름과 영상만 담깁니다. 최근 클릭·날짜 메모는 포함되지 않습니다.':'즐겨찾기·최근 클릭·목록·날짜 메모·테마를 담습니다. 백업 코드는 암호화되지 않으므로 본인 이전용으로 보관하세요. 목록만 공유하려면 목록의 ‘공유 코드’를 이용하세요.';$('#transferCode').readOnly=true;$('#transferCode').value='코드를 만드는 중입니다.';$('#codeMessage').textContent='';$('#codePreview').hidden=true;$('#codeCopy').hidden=false;$('#codeCopy').disabled=true;$('#codeApply').hidden=true;$('#applyThemeWrap').hidden=true;transferMode='export';$('#codeDialog').showModal();try{const code=await makeTransferCode(doc);$('#transferCode').value=code;$('#codeMessage').textContent=code.length.toLocaleString()+'자의 코드입니다. 복사해 보관하거나 전달한 뒤, 다른 브라우저의 ‘코드 가져오기’에 넣으세요.';$('#codeCopy').disabled=false}catch(e){$('#transferCode').value='';$('#codeMessage').textContent=e.message}}
async function previewCode(){const button=$('#codePreview');button.disabled=true;try{transferPreview=await readTransferCode($('#transferCode').value);const doc=transferPreview.doc;$('#codeMessage').textContent=doc.type==='yeokka-list'?'목록 “'+doc.name+'” · 영상 '+doc.videos.length+'개. 이 브라우저에 독립된 목록으로 추가합니다.':'내 정보 백업 · 즐겨찾기 '+doc.data.favorites.length+'개 · 최근 클릭 '+doc.data.history.length+'개 · 목록 '+doc.data.lists.length+'개 · 날짜 메모 '+Object.keys(doc.notes).length+'개. 기존 내용은 유지하며 합칩니다.';$('#codeApply').hidden=false;$('#applyThemeWrap').hidden=doc.type!=='yeokka-backup'||!doc.theme;$('#applyTheme').checked=false;}catch(e){transferPreview=null;$('#codeApply').hidden=true;$('#codeMessage').textContent=e.message}finally{button.disabled=false}}
async function applyCode(){if(!transferPreview)return;const button=$('#codeApply');button.disabled=true;try{const {doc,fingerprint}=transferPreview,current=readLocal();let merged,receivedId=null,mergedNotes=null;
 if(doc.type==='yeokka-list'){const existing=current.lists.find(l=>l.sourceKey===fingerprint);receivedId=existing?.id||newListId();const incoming={version:1,favorites:[],history:[],lists:[{id:receivedId,name:doc.name,createdAt:new Date().toISOString(),sourceKey:fingerprint,videos:doc.videos}]};merged=mergeLibraries(current,incoming)}else{merged=mergeLibraries(current,doc.data);mergedNotes={...doc.notes,...checkedNotes(JSON.parse(localStorage.getItem(notesKey)||'{}'))}}
 const patch={[libraryKey]:JSON.stringify(merged)};if(mergedNotes)patch[notesKey]=JSON.stringify(mergedNotes);if(doc.type==='yeokka-backup'&&doc.theme&&$('#applyTheme').checked)patch[themeKey]=doc.theme;commitLocal(patch);if(mergedNotes)notes=mergedNotes;if(patch[themeKey])setTheme(doc.theme);render();await loadPersonal();$('#codeDialog').close();libraryTab=receivedId?'lists':'favorites';libraryQuery='';selectedList=null;renderLibrary();if(!$('#libraryDialog').open)$('#libraryDialog').showModal();if(receivedId)await openList(receivedId);libraryError('코드를 가져왔습니다. 기존 정보와 중복 영상은 유지하고 합쳤습니다.');transferPreview=null;}catch(e){$('#codeMessage').textContent=e.message}finally{button.disabled=false}}
$('#myLibrary').onclick=()=>{libraryQuery='';renderLibrary();$('#libraryDialog').showModal();loadPersonal()};$('#libraryClose').onclick=()=>$('#libraryDialog').close();$('#librarySearch').oninput=e=>{libraryQuery=e.target.value;renderLibrary()};$$('[data-library-tab]').forEach(b=>b.onclick=()=>{libraryTab=b.dataset.libraryTab;selectedList=null;libraryQuery='';renderLibrary()});
$('#newList').onclick=async()=>{const button=$('#newList');button.disabled=true;try{const result=await personalRequest({action:'create_list',listId:newListId(),name:$('#newListName').value});$('#newListName').value='';await loadPersonal();await openList(result.id)}catch(e){libraryError(e.message)}finally{button.disabled=false}};
$('#backupCode').onclick=()=>openCodeExport().catch(e=>libraryError(e.message));$('#importCode').onclick=openCodeImport;
$('#chooseCancel').onclick=()=>$('#chooseDialog').close();$('#chooseSave').onclick=async()=>{const button=$('#chooseSave');button.disabled=true;try{let id=$('#chooseListSelect').value;const name=$('#chooseNewName').value.trim();if(name){const result=await personalRequest({action:'create_list',listId:newListId(),name});id=result.id}if(!id)throw Error('목록을 선택하거나 새 목록 이름을 입력해 주세요.');await personalRequest({action:'add_to_list',listId:id,video:choosingVideo});$('#chooseDialog').close();await loadPersonal();if(selectedList===id)await openList(id);libraryError('')}catch(e){$('#chooseError').textContent=e.message}finally{button.disabled=false}};
$('#renameCancel').onclick=()=>$('#renameDialog').close();$('#renameSave').onclick=async()=>{try{await personalRequest({action:'rename_list',listId:selectedList,name:$('#renameName').value});$('#renameDialog').close();await loadPersonal()}catch(e){$('#renameError').textContent=e.message}};
$('#codeClose').onclick=()=>$('#codeDialog').close();$('#codePreview').onclick=previewCode;$('#codeApply').onclick=applyCode;$('#transferCode').oninput=()=>{if(transferMode==='import'){transferPreview=null;$('#codeApply').hidden=true;$('#applyThemeWrap').hidden=true}};$('#codeCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#transferCode').value);$('#codeMessage').textContent='코드를 복사했습니다.'}catch{$('#transferCode').focus();$('#transferCode').select();$('#codeMessage').textContent='코드를 선택했습니다. 복사해서 보관하거나 전달해 주세요.'}};
document.addEventListener('click',async e=>{const watch=e.target.closest('a[data-watch]');if(watch&&e.button===0)recordClick(watch.dataset.watch);const button=e.target.closest('button');if(!button)return;try{
 if(button.hasAttribute('data-fav'))await toggleFavorite(button.dataset.fav);
 else if(button.hasAttribute('data-add'))await chooseList(button.dataset.add);
 else if(button.hasAttribute('data-library-reload'))await loadPersonal();
 else if(button.hasAttribute('data-library-note'))openNote(button.dataset.libraryNote);
 else if(button.hasAttribute('data-list-open'))await openList(button.dataset.listOpen);
 else if(button.hasAttribute('data-list-back')){selectedList=null;renderLibrary()}
 else if(button.hasAttribute('data-item-remove')){await personalRequest({action:'remove_from_list',listId:selectedList,videoId:button.dataset.itemRemove});await loadPersonal();await openList(selectedList)}
 else if(button.hasAttribute('data-history-remove')){await personalRequest({action:'remove_history',videoId:button.dataset.historyRemove});await loadPersonal()}
 else if(button.hasAttribute('data-history-clear')){if(!confirm('최근 시청 기록을 모두 지울까요?'))return;await personalRequest({action:'clear_history'});await loadPersonal()}
 else if(button.hasAttribute('data-list-share'))await openCodeExport(button.dataset.listShare);
 else if(button.hasAttribute('data-list-delete')){if(!confirm('이 목록을 삭제할까요? 담긴 영상의 즐겨찾기는 유지됩니다.'))return;await personalRequest({action:'delete_list',listId:button.dataset.listDelete});selectedList=null;await loadPersonal()}
 else if(button.hasAttribute('data-list-rename')){const l=personal.lists.find(x=>x.id===selectedList);$('#renameName').value=l?.name||'';$('#renameError').textContent='';$('#renameDialog').showModal()}
 }catch(err){libraryError(err.message)}});
document.addEventListener('auxclick',e=>{const a=e.target.closest('a[data-watch]');if(a&&e.button===1)recordClick(a.dataset.watch)});
window.addEventListener('storage',e=>{if(e.key===libraryKey){loadPersonal().then(()=>{if(selectedList){const list=personal.lists.find(l=>l.id===selectedList);listVideos=list?.videos||[];if($('#libraryDialog').open)renderLibrary()}})}});
loadPersonal();

load();setInterval(()=>{if(!document.hidden){if(view==='year'&&!yearLoading)loadYear();else if(view!=='year'&&!loading)load()}},300000);
</script></body></html>
